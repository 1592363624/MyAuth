# GitHub Actions 工作流：MyAuth 前后端按需自动化构建并部署到 Windows 宝塔面板
#
# 功能说明：
#   本工作流在 push 到 master 分支或手动触发时，自动完成以下操作：
#   1. 先通过 changes Job 检测本次提交修改了后端（myauth/**）还是前端（myauth-web/**）；
#   2. 只改了前端 -> 仅构建并上传前端 dist，不重启后端；
#      只改了后端 -> 仅构建 jar、上传并重启 Java 进程；
#      两端都改   -> 两个部署 Job 并行执行；
#   3. 后端部署：Maven + JDK 21 构建 jar，SCP 上传，SSH 执行 PowerShell 脚本重启（自带备份/回滚）；
#   4. 前端部署：Node + Yarn 构建 dist，生产 API 根地址通过 GitHub Secrets 注入，SCP 上传覆盖。
#
# 手动触发（workflow_dispatch）：
#   可通过 backend / frontend 两个下拉框强制控制：
#     auto   = 按代码变更自动判断（手动触发时无变更基线，等价于不部署）
#     deploy = 强制部署该端
#     skip   = 强制跳过该端（即使有变更也不部署）
#
# 前置条件：
#   - Windows 服务器已安装并启用 OpenSSH Server（宝塔面板通常会自动安装）；
#   - 服务器防火墙放行 SSH 端口（默认 22）；
#   - 已在 GitHub 仓库 Settings -> Secrets and variables -> Actions 中配置全部依赖 secrets。
#   - 后端 jar 目标目录、前端网站根目录需提前在服务器上创建好并具备写入权限。

name: Deploy to Windows Baota Panel

on:
  # master 分支发生 push 且改动涉及前后端目录时才触发（纯文档等改动不触发）
  push:
    branches:
      - master
    paths:
      - 'myauth/**'
      - 'myauth-web/**'
  # 支持在 Actions 页面手动触发，可强制指定部署哪一端
  workflow_dispatch:
    inputs:
      backend:
        description: '后端部署策略'
        type: choice
        options:
          - auto
          - deploy
          - skip
        default: auto
      frontend:
        description: '前端部署策略'
        type: choice
        options:
          - auto
          - deploy
          - skip
        default: auto

# 所有可配置的敏感信息/环境差异项均通过 Secrets 注入，避免硬编码
env:
  # 后端 jar 在服务器上的固定名称，方便重启脚本定位。
  # 根据用户现有宝塔部署习惯，保持与服务器上 myauth.jar 同名，直接覆盖并重启。
  BACKEND_JAR_NAME: myauth.jar

jobs:
  # ============================================================
  # Job 0：变更检测
  # 判断本次提交到底改了后端还是前端，输出给后续两个部署 Job 做条件判断
  # ============================================================
  changes:
    runs-on: ubuntu-latest
    outputs:
      backend: ${{ steps.filter.outputs.backend }}
      frontend: ${{ steps.filter.outputs.frontend }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Detect changed paths
        uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            backend:
              - 'myauth/**'
            frontend:
              - 'myauth-web/**'

  # ============================================================
  # Job 1：后端部署（仅后端有变更，或手动强制 deploy 时执行）
  # ============================================================
  deploy-backend:
    needs: changes
    # 触发条件：
    #   push 事件且检测到后端变更，且未被手动 skip；
    #   或手动触发时 backend 选择了 deploy
    if: |
      (github.event_name == 'push' && needs.changes.outputs.backend == 'true' && github.event.inputs.backend != 'skip') ||
      github.event.inputs.backend == 'deploy'
    # Ubuntu Runner 构建速度更快，构建产物再上传到 Windows 服务器
    runs-on: ubuntu-latest

    steps:
      # 步骤 1：检出代码
      - name: Checkout repository
        uses: actions/checkout@v4

      # 步骤 2：配置 JDK 21（与 pom.xml 中 java.version 保持一致）
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          # 启用 Maven 依赖缓存，加速后续构建
          cache: maven

      # 步骤 3：Maven 构建后端，跳过测试以缩短 CI 时间
      # 说明：
      #   1. 真实 config/application.yml 已被 .gitignore 忽略且不入库、不泄露；
      #   2. 仓库仅含 config/application.example.yml 模板（带 ${MYAUTH_*} 占位符），
      #      打包进 jar 的是模板默认值，生产配置由服务器 C:/wwwroot/myauth/config/application.yml
      #      外部文件提供（Spring Boot 自动优先读取，重传 jar 不覆盖）；
      #   3. 防御性删除：确保打包环境不存在真实配置，避免误打入 jar。
      - name: Build backend with Maven
        working-directory: ./myauth
        run: |
          # 防御性检查：确保打包环境不存在真实外部配置（避免误打入 jar）
          if [ -f src/main/resources/config/application.yml ]; then
            echo "WARN: 发现真实 config/application.yml，已跳过打包该文件"
            rm -f src/main/resources/config/application.yml
          fi
          mvn -B package -DskipTests

      # 步骤 4：将构建出的 jar 重命名为固定名称，并对 jar 做 gzip 压缩，再上传
      #      压缩后再 SCP，可显著缩短传输时间（spring boot jar 压缩率约 1/3），
      #      同时降低 SSH 通道被中间链路 idle 掐断的概率。
      - name: Rename backend jar and gzip it
        working-directory: ./myauth
        run: |
          ls target/*.jar
          cp target/myauth-*.jar target/${{ env.BACKEND_JAR_NAME }}
          # 用 gzip 压一下，jar 内大量重复 class 字节码，压缩收益很高
          gzip -kf target/${{ env.BACKEND_JAR_NAME }}
          ls -la target/${{ env.BACKEND_JAR_NAME }}*

      # 步骤 5：通过 scp 上传后端 jar（.jar.gz）到 Windows 服务器
      #
      # 说明：
      #   - 放弃 appleboy/scp-action（其 v0.1.7 在 SSH 断连后不会及时退出，会反复攒 progress
      #     样本拖到 command_timeout 才报错，正是本次卡 19 分钟的根因）。
      #   - 改用 GitHub ubuntu runner 自带的原生 scp 命令（openssh-client），配合：
      #       1. -C 启用 SSH 压缩（jar 压缩后约 1/3，传输更快）；
      #       2. 自动重试循环（最多 3 次，间隔 10s），断连后自动重新上传；
      #       3. 私钥写入临时文件，ssh 指纹 StrictHostKeyChecking 默认自动接受；
      #   - 与远端 Windows OpenSSH 兼容：target 使用正斜杠格式 /C:/wwwroot/...，
      #     scp 服务端会正确解析为 C:\wwwroot\...。
      - name: Upload backend jar to Windows server
        env:
          WIN_HOST: ${{ secrets.WIN_HOST }}
          WIN_PORT: ${{ secrets.WIN_PORT }}
          WIN_USER: ${{ secrets.WIN_USER }}
          WIN_SSH_KEY: ${{ secrets.WIN_SSH_KEY }}
          BACKEND_REMOTE_DIR: ${{ secrets.BACKEND_REMOTE_DIR }}
        run: |
          set -euo pipefail

          # =================================================================
          # 行为说明（解决"不知道是不是卡住了"的疑虑）：
          #   GitHub Actions 的 run: 块是 detached 的，scp 的伪终端进度条 (xxx%)
          #   被 GH 截掉看不到。本流程用"verbose + 关键阶段 echo + 计时报时"代替实时进度条：
          #     - -v 输出每个里程碑：握手/认证/开远程文件/写数据/关文件
          #     - 在每个里程碑前后 echo 时间和已耗时，让你秒判断是真卡还是传输中
          #     - 用 trap 捕获 ERR 与关键信号，打印堆栈而不只是静默挂死
          #   真正卡死的判定：连续 2 分钟没有任何 verbose 输出 + 没到 close file 阶段，才视为卡死。
          # =================================================================
          ts() { date '+%H:%M:%S'; }
          mark() { echo "[$(ts)] $*"; }

          START_TIME=$(date +%s)

          # 0. 解析参数 + 显示源文件大小（让你心里有数）
          remote_dir="${BACKEND_REMOTE_DIR//\\//}"
          case "$remote_dir" in
            [A-Za-z]:/*)
              remote_dir="/${remote_dir%%:*}:${remote_dir#*:}"
              ;;
          esac

          src="myauth/target/${{ env.BACKEND_JAR_NAME }}.gz"
          if [ ! -f "$src" ]; then
            mark "ERROR: 找不到源文件 $src"
            exit 1
          fi
          src_size=$(stat -c%s "$src")
          src_size_hr=$(numfmt --to=iec --suffix=B "$src_size" 2>/dev/null || echo "${src_size}B")

          mark "==== 上传准备 ===="
          mark "源文件    : $src ($src_size_hr)"
          mark "目标服务器: ${WIN_USER}@${WIN_HOST}:${remote_dir}/"
          mark "目标端口  : $WIN_PORT"

          # 1. 私钥写入临时文件；EXIT trap 同时清理临时文件 + 打印最终耗时
          tmpkey="$(mktemp)"
          printf '%s\n' "$WIN_SSH_KEY" > "$tmpkey"
          chmod 600 "$tmpkey"
          mark "私钥已写入 $tmpkey"
          cleanup_rc=0
          trap 'cleanup_rc=$?; rm -f "$tmpkey" 2>/dev/null || true; mark "退出码 $cleanup_rc，已耗时 $(( $(date +%s) - START_TIME ))s"; exit $cleanup_rc' EXIT

          # 2. 尝试 3 次，每次失败前先告知等了多久
          SUCCEEDED=0
          for attempt in 1 2 3; do
            mark "==== scp 上传尝试 #$attempt (累计 $(( $(date +%s) - START_TIME ))s) ===="
            mark "[$(ts)] 正在连接 ${WIN_HOST}:${WIN_PORT} ..."
            # -O 强制使用传统 scp 协议（非默认的 sftp 子系统）。
            # Windows OpenSSH 的 sftp 服务端在传输较大文件（如本 jar 71MB）时
            # 偶发在"打开远程文件"阶段挂起（对应日志最后一行 debug1: pledge: fork 后无输出），
            # 传统 scp 协议处理大文件明显更稳，且能实时打印进度。
            if scp -O -v -C \
                 -P "$WIN_PORT" \
                 -i "$tmpkey" \
                 -o StrictHostKeyChecking=no \
                 -o UserKnownHostsFile=/dev/null \
                 -o ConnectTimeout=30 \
                 -o ServerAliveInterval=30 \
                 -o ServerAliveCountMax=10 \
                 "$src" "${WIN_USER}@${WIN_HOST}:${remote_dir}/"; then
              mark "[$(ts)] 上传完成 ✅ 总耗时 $(( $(date +%s) - START_TIME ))s 平均 $(( src_size / ($(date +%s) - START_TIME + 1) / 1024 ))KB/s"
              SUCCEEDED=1
              break
            fi
            rc=$?
            if [ "$attempt" -eq 3 ]; then
              mark "ERROR: scp 失败（已重试 3 次，最终退出码 $rc）"
              cleanup_rc=$rc
              exit $rc
            fi
            mark "[$(ts)] scp 失败 rc=$rc，10 秒后重试 ..."
            sleep 10
          done

          if [ "$SUCCEEDED" -ne 1 ]; then
            cleanup_rc=1
            exit 1
          fi
          exit 0

          if [ "$SUCCEEDED" -ne 1 ]; then
            exit 1
          fi

      # 步骤 6：通过 SSH 执行 PowerShell 脚本重启后端 Java 进程（进程模式）
      #
      # 设计目标：无论 jar 更新成功或失败，最终都必须保证有一个后端进程在正常运行，
      #           绝不允许出现“更新后项目起不来”的雪崩情况。
      #
      # 健壮性保障：
      #   1. 启动新 jar 前先备份旧 jar 为 myauth.jar.bak；
      #   2. 用 WMI 精准匹配命令行包含 myauth.jar 的 java 进程并停止；
      #   3. 启动后轮询 6401 端口（最多 ~90s）确认存活；
      #   4. 若新 jar 启动失败（端口不通），自动回滚到 myauth.jar.bak 并重启旧版本；
      #   5. 最终兜底：只要端口仍不通就抛出错误，由 GitHub Actions 标记失败便于人工介入，
      #      但此时旧版本已在运行，项目不会崩。
      #
      # 连接稳定性增强（解决"传 jar 卡 19 分钟"问题）：
      #   - 在脚本开头先调用 sshd_config_set：把 ClientAliveInterval=30、ClientAliveCountMax=10
      #     写入 Windows OpenSSH 的 sshd_config 并重启 sshd 服务，让服务端每 30s 发一次 keepalive，
      #     最多允许 10 次（即 5 分钟无活动才断开）。这样 GitHub runner 在 jar 上传期间即使
      #     没有产生流量，SSH 通道也不会被中间链路/NAT 误判为 idle 而掐断。
      - name: Restart backend Java application
        uses: appleboy/ssh-action@v1.2.5
        env:
          # 将整文件 Secret 映射为远程环境变量，供 PowerShell 脚本写出后端配置
          BACKEND_CONFIG_YML: ${{ secrets.BACKEND_CONFIG_YML }}
        with:
          host: ${{ secrets.WIN_HOST }}
          port: ${{ secrets.WIN_PORT }}
          username: ${{ secrets.WIN_USER }}
          # 使用私钥登录（密钥登录模式）
          key: ${{ secrets.WIN_SSH_KEY }}
          # Windows 服务器默认 shell 为 PowerShell
          script: |
            $ErrorActionPreference = "Stop"

            # --------- 服务器侧 SSH keepalive 兜底配置 ---------
            # 解决"scp 上传时 SSH 长连接被中间链路/NAT 当 idle 掐断"问题。
            # Windows OpenSSH 的 sshd_config 默认路径：C:\ProgramData\ssh\sshd_config
            # 设置 ClientAliveInterval=30 + ClientAliveCountMax=10，
            # 意味着服务端每 30s 主动发一次心跳，最长允许 5 分钟空闲，超时才断开。
            # 每次部署都做幂等判断并安全重启 sshd（避免锁死当前 SSH 会话）。
            $sshdConfig = "C:\ProgramData\ssh\sshd_config"
            if (Test-Path $sshdConfig) {
                $needRestart = $false
                $lines = Get-Content $sshdConfig -ErrorAction SilentlyContinue
                $hasInterval = $lines | Where-Object { $_ -match '^\s*ClientAliveInterval\s+' }
                $hasCountMax = $lines | Where-Object { $_ -match '^\s*ClientAliveCountMax\s+' }
                if (-not $hasInterval) {
                    Add-Content -Path $sshdConfig -Value "ClientAliveInterval 30"
                    $needRestart = $true
                }
                if (-not $hasCountMax) {
                    Add-Content -Path $sshdConfig -Value "ClientAliveCountMax 10"
                    $needRestart = $true
                }
                if ($needRestart) {
                    Write-Host "已写入 sshd keepalive 配置，重启 sshd 服务使其生效..."
                    Restart-Service sshd -ErrorAction SilentlyContinue
                } else {
                    Write-Host "sshd keepalive 已配置，跳过"
                }
            } else {
                Write-Host "WARN: 未找到 $sshdConfig，跳过 keepalive 配置"
            }

            $backendDir  = "${{ secrets.BACKEND_REMOTE_DIR }}"
            $jarName     = "${{ env.BACKEND_JAR_NAME }}"
            $jarPath     = Join-Path $backendDir $jarName
            $bakJarPath  = Join-Path $backendDir ($jarName + ".bak")
            $gzJarPath   = Join-Path $backendDir ($jarName + ".gz")
            $listenPort  = 6401   # 与宝塔执行命令 --server.port=6401 保持一致
            $javaExe     = "C:\BtSoft\jdk\jdk21\bin\java.exe"

            Write-Host "Backend dir : $backendDir"
            Write-Host "Jar path    : $jarPath"
            Write-Host "Listen port : $listenPort"

            # 等待 TCP 端口就绪的函数：最多等待 $timeoutSec 秒，每 3 秒探测一次
            function Wait-PortOpen {
                param([int]$Port, [int]$TimeoutSec = 90)
                $deadline = (Get-Date).AddSeconds($TimeoutSec)
                while ((Get-Date) -lt $deadline) {
                    try {
                        $tcp = New-Object System.Net.Sockets.TcpClient
                        $tcp.Connect("127.0.0.1", $Port)
                        $tcp.Close()
                        return $true
                    } catch {
                        Start-Sleep -Seconds 3
                    }
                }
                return $false
            }

            # 通过 WMI 精准定位“命令行包含 myauth.jar”的 java 进程并强制停止
            function Stop-MyauthProcess {
                $procs = Get-CimInstance Win32_Process -Filter "Name = 'java.exe'" `
                    | Where-Object { $_.CommandLine -like "*$jarName*" }
                foreach ($p in $procs) {
                    Write-Host "停止旧进程 PID=$($p.ProcessId)"
                    Stop-Process -Id $p.ProcessId -Force -ErrorAction SilentlyContinue
                }
                Start-Sleep -Seconds 3
            }

            # 启动 jar 的封装函数（与宝塔执行命令参数保持一致）
            function Start-Myauth {
                param([string]$JarToRun)
                Write-Host "启动 jar: $JarToRun"
                Start-Process -FilePath $javaExe `
                    -ArgumentList "-jar", "-Xmx1024M", "-Xms256M", `
                        "`"$JarToRun`"", "--server.port=$listenPort" `
                    -WindowStyle Hidden `
                    -WorkingDirectory $backendDir
            }

            # ---------- 主流程 ----------

            # 0. 清理上次未完成的 scp 残缺上传（防御性）
            #    背景：2026-08-15 实测两次推送都因 GitHub runner → Windows OpenSSH 的 sftp
            #    通道在"打开远程文件"阶段挂起而失败，期间已在 $backendDir 下生成了不完整
            #    的 myauth.jar.gz（例如 6.72 MB，远小于完整 jar）。如果不清它，下次解压
            #    GZipStream 会抛 InvalidDataException，导致整个部署失败且回滚链也指向残缺文件。
            #    这里用 try/finally 保证无论删除成败，主流程都继续往下走。
            if (Test-Path $gzJarPath) {
                Write-Host "发现已存在的 $gzJarPath，先清理（避免与新上传冲突） ..."
                try {
                    Remove-Item -Path $gzJarPath -Force -ErrorAction Stop
                    Write-Host "已清理旧 .jar.gz"
                } catch {
                    Write-Host "WARN: 清理旧 .jar.gz 失败 ($($_.Exception.Message))，将尝试强制覆盖"
                }
            }
            # 校验 jar 本体大小（如果存在）的合理性，防止半成品 jar 残留
            if (Test-Path $jarPath) {
                $existingJarSize = (Get-Item $jarPath).Length
                if ($existingJarSize -lt 10MB) {
                    Write-Host "WARN: 现有 $jarName 大小仅 ${existingJarSize}B，过小疑似残缺，重命名为 .bak.broken 以备排查"
                    $brokenPath = Join-Path $backendDir ($jarName + ".bak.broken")
                    try {
                        Move-Item -Path $jarPath -Destination $brokenPath -Force
                        Write-Host "已将可疑残缺 jar 隔离到 $brokenPath"
                    } catch {
                        Write-Host "WARN: 隔离残缺 jar 失败 ($($_.Exception.Message))"
                    }
                } else {
                    Write-Host "现有 $jarName 大小 $existingJarSize 字节，正常"
                }
            }

            # 1. 写出外部生产配置（jar 所在目录的 config\application.yml）
            #    说明：用户服务器实际路径为 C:\wwwroot\myauth\config\application.yml，
            #    这是 Spring Boot 标准外部 config 子目录约定，优先级高于 jar 内部配置，
            #    且后续重传 jar 不会覆盖它。该文件作为主配置直接使用（不依赖 profile）。
            #    整文件 Secret(BACKEND_CONFIG_YML) 直接写出覆盖；若未配置该 Secret，则保留服务器现有文件。
            $configDir  = Join-Path $backendDir "config"
            $prodConfig = Join-Path $configDir "application.yml"
            if (-not (Test-Path $configDir)) {
                New-Item -ItemType Directory -Path $configDir -Force | Out-Null
            }
            if ($env:BACKEND_CONFIG_YML) {
                # 写入 UTF-8 BOM（Windows PowerShell 默认 Set-Content 为 UTF-16，Spring 读取需 UTF-8）
                $utf8 = New-Object System.Text.UTF8Encoding($true)
                [System.IO.File]::WriteAllText($prodConfig, $env:BACKEND_CONFIG_YML, $utf8)
                Write-Host "已用 BACKEND_CONFIG_YML 覆盖写出 config\application.yml"
            } else {
                Write-Host "WARN: 未配置 BACKEND_CONFIG_YML，保留服务器现有 config\application.yml"
            }

            # 1. 备份当前（旧）jar，供失败回滚使用
            #    注意：必须在解压新 jar 之前备份，否则 $jarPath 已被新版本覆盖，
            #    备份出来的 .bak 就会是新 jar，回滚将失去意义。
            #    如果前面的清理步骤已经把残缺 jar 隔离到 .bak.broken（场景：上次部署意外中断），
            #    此时 $jarPath 不存在，回滚降级为"无旧版本可回"，仅打印提示，不抛错。
            if (Test-Path $jarPath) {
                Copy-Item -Path $jarPath -Destination $bakJarPath -Force
                Write-Host "已备份旧 jar -> $bakJarPath"
            } else {
                Write-Host "WARN: $jarPath 不存在，无旧 jar 可备份（可能为首次部署或上次的 jar 已被隔离为残缺）"
            }

            # 1.5 解压上传的 jar.gz，覆盖为新的 myauth.jar
            #     解压失败则直接抛错，此时 $jarPath 仍是旧版本、旧进程未停，
            #     线上不会被这次失败影响，回滚也不需要（旧 jar 还在）。
            if (Test-Path $gzJarPath) {
                Write-Host "检测到压缩包 $gzJarPath，开始解压..."
                # 用 .NET 流式 gzip，PowerShell 原生支持，不依赖 tar/7z
                $gzStream = [System.IO.File]::OpenRead($gzJarPath)
                try {
                    $decodedStream = New-Object System.IO.Compression.GZipStream(
                        $gzStream,
                        [System.IO.Compression.CompressionMode]::Decompress
                    )
                    try {
                        $outStream = [System.IO.File]::Create($jarPath)
                        try {
                            $decodedStream.CopyTo($outStream)
                        } finally {
                            $outStream.Close()
                        }
                    } finally {
                        $decodedStream.Close()
                    }
                } finally {
                    $gzStream.Close()
                }
                Remove-Item -Path $gzJarPath -Force
                $freshJar = (Get-Item $jarPath).Length
                Write-Host "解压完成，jar 大小 $freshJar 字节"
            }

            # 2. 停止旧进程
            Stop-MyauthProcess

            # 3. 启动新 jar
            Start-Myauth -JarToRun $jarPath

            # 4. 等待新 jar 就绪
            $ok = Wait-PortOpen -Port $listenPort -TimeoutSec 90
            if ($ok) {
                Write-Host "新版本启动成功，端口 $listenPort 已就绪"
                exit 0
            }

            # 5. 新版本启动失败 -> 回滚到旧 jar 并重启
            Write-Host "新版本启动失败，开始回滚到旧 jar ..."
            Stop-MyauthProcess
            if (Test-Path $bakJarPath) {
                Copy-Item -Path $bakJarPath -Destination $jarPath -Force
                Start-Myauth -JarToRun $jarPath
                $ok = Wait-PortOpen -Port $listenPort -TimeoutSec 90
                if ($ok) {
                    Write-Host "已回滚到旧版本，端口 $listenPort 已就绪（项目未中断）"
                    exit 0
                }
            }

            # 6. 兜底：新旧都起不来，抛错让 Actions 标记失败，便于人工介入
            throw "致命错误：新版本与回滚版本均无法启动，端口 $listenPort 未就绪，请立即人工检查服务器！"

  # ============================================================
  # Job 2：前端部署（仅前端有变更，或手动强制 deploy 时执行）
  # 纯前端更新不会触碰后端进程，网站零中断
  # ============================================================
  deploy-frontend:
    needs: changes
    # 触发条件：
    #   push 事件且检测到前端变更，且未被手动 skip；
    #   或手动触发时 frontend 选择了 deploy
    if: |
      (github.event_name == 'push' && needs.changes.outputs.frontend == 'true' && github.event.inputs.frontend != 'skip') ||
      github.event.inputs.frontend == 'deploy'
    runs-on: ubuntu-latest

    steps:
      # 步骤 1：检出代码
      - name: Checkout repository
        uses: actions/checkout@v4

      # 步骤 2：配置 Node.js 环境，用于构建前端
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          # 使用 yarn 作为包管理器，并锁定 yarn.lock，保证依赖可复现
          cache: yarn
          cache-dependency-path: myauth-web/yarn.lock

      # 步骤 3：安装前端依赖并构建生产环境产物
      # 说明：
      #   1. 构建期变量（项目名/版本号等）来自已提交的 myauth-web/.env；
      #   2. 真实 serverConfig.json 已被 .gitignore 忽略且从仓库移除，不入库、不泄露；
      #   3. 这里用整文件 Secret(FRONTEND_CONFIG_JSON) 通过 env 映射写出生产 serverConfig.json 再 build，
      #      避免在 shell 中内联 ${{ }} 造成解析错误/密钥泄露；
      #   4. 若未配置该 Secret，则保留仓库模板默认值（仅用于本地/测试）。
      - name: Build frontend with Yarn
        working-directory: ./myauth-web
        env:
          # 将整文件 Secret 映射为环境变量，供下面 shell 安全引用
          FRONTEND_CONFIG_JSON: ${{ secrets.FRONTEND_CONFIG_JSON }}
        run: |
          yarn install --frozen-lockfile
          # 用整文件 Secret 覆盖生成生产用的 serverConfig.json（存在才覆盖）
          if [ -n "$FRONTEND_CONFIG_JSON" ]; then
            printf '%s\n' "$FRONTEND_CONFIG_JSON" > public/serverConfig.json
            echo "已用 FRONTEND_CONFIG_JSON 生成生产 serverConfig.json"
          else
            echo "WARN: 未配置 FRONTEND_CONFIG_JSON，使用仓库默认 serverConfig.json"
          fi
          yarn build

      # 步骤 4：打包 + scp 上传前端 dist 到 Windows 服务器
      #
      # 说明：target 目录对应宝塔网站根目录，如 C:/wwwroot/my.52shell.ltd/
      #
      # 稳定性增强（与后端上传一致）：
      #   1. 放弃 appleboy/scp-action（v0.1.7 断连卡死 bug），改用原生 scp；
      #   2. 先把整个 dist 打包成单个 tar.gz（前端 js/css 压缩率极高，可压到 1/10 甚至更低），
      #      只上传 1 个文件，彻底规避"大量小文件 + idle SSH 通道"导致的断连；
      #   3. scp 用 -C 压缩 + ServerAliveInterval 保活 + 自动重试 3 次；
      #   4. 服务器端用 Windows 自带 bsdtar 解压（默认覆盖同名文件、不清空目录，
      #      保留用户自行放置的静态资源，与旧 overwrite:false 语义一致）。
      #   5. -v 输出握手/认证里程碑，echo 时间戳与已耗时，缓解"看不到进度"的焦虑；
      #      真正判定卡死：连续 2 分钟内 -v 无任何新输出。
      - name: Package and upload frontend dist
        env:
          WIN_HOST: ${{ secrets.WIN_HOST }}
          WIN_PORT: ${{ secrets.WIN_PORT }}
          WIN_USER: ${{ secrets.WIN_USER }}
          WIN_SSH_KEY: ${{ secrets.WIN_SSH_KEY }}
          FRONTEND_REMOTE_DIR: ${{ secrets.FRONTEND_REMOTE_DIR }}
        run: |
          set -euo pipefail

          ts() { date '+%H:%M:%S'; }
          mark() { echo "[$(ts)] $*"; }
          START_TIME=$(date +%s)

          # 1. 打包 dist 为单个 tar.gz
          mark "==== 打包前端 dist ===="
          tar -C myauth-web -czf dist.tar.gz dist
          src_size=$(stat -c%s dist.tar.gz)
          src_size_hr=$(numfmt --to=iec --suffix=B "$src_size" 2>/dev/null || echo "${src_size}B")
          mark "已生成 dist.tar.gz ($src_size_hr)"

          # 2. 路径转换
          remote_dir="${FRONTEND_REMOTE_DIR//\\//}"
          case "$remote_dir" in
            [A-Za-z]:/*)
              remote_dir="/${remote_dir%%:*}:${remote_dir#*:}"
              ;;
          esac

          mark "==== 上传准备 ===="
          mark "目标服务器: ${WIN_USER}@${WIN_HOST}:${remote_dir}/"

          tmpkey="$(mktemp)"
          printf '%s\n' "$WIN_SSH_KEY" > "$tmpkey"
          chmod 600 "$tmpkey"
          cleanup_rc=0
          trap 'cleanup_rc=$?; rm -f "$tmpkey" dist.tar.gz 2>/dev/null || true; mark "退出码 $cleanup_rc，已耗时 $(( $(date +%s) - START_TIME ))s"; exit $cleanup_rc' EXIT

          SUCCEEDED=0
          for attempt in 1 2 3; do
            mark "==== scp 上传尝试 #$attempt (累计 $(( $(date +%s) - START_TIME ))s) ===="
            mark "[$(ts)] 正在连接 ${WIN_HOST}:${WIN_PORT} ..."
            # -O 强制使用传统 scp 协议（与后端上传一致），
            # Windows OpenSSH 的 sftp 服务端在传大文件时易在"打开远程文件"阶段挂起，
            # 传统 scp 协议处理更稳。
            if scp -O -v -C \
                 -P "$WIN_PORT" \
                 -i "$tmpkey" \
                 -o StrictHostKeyChecking=no \
                 -o UserKnownHostsFile=/dev/null \
                 -o ConnectTimeout=30 \
                 -o ServerAliveInterval=30 \
                 -o ServerAliveCountMax=10 \
                 dist.tar.gz "${WIN_USER}@${WIN_HOST}:${remote_dir}/dist.tar.gz"; then
              mark "[$(ts)] 上传完成 ✅ 总耗时 $(( $(date +%s) - START_TIME ))s"
              SUCCEEDED=1
              break
            fi
            rc=$?
            if [ "$attempt" -eq 3 ]; then
              mark "ERROR: 前端 scp 失败（已重试 3 次，最终退出码 $rc）"
              cleanup_rc=$rc
              exit $rc
            fi
            mark "[$(ts)] scp 失败 rc=$rc，10 秒后重试 ..."
            sleep 10
          done

          if [ "$SUCCEEDED" -ne 1 ]; then
            cleanup_rc=1
            exit 1
          fi
          exit 0

      # 步骤 4.5：SSH 到服务器解压前端 dist
      # 用 Windows 自带 bsdtar 解压 tar.gz，覆盖同名文件且不清空目录，
      # 与旧 overwrite:false 语义一致（保留用户自行放置的静态资源）。
      - name: Extract frontend dist on server
        uses: appleboy/ssh-action@v1.2.5
        env:
          FRONTEND_REMOTE_DIR: ${{ secrets.FRONTEND_REMOTE_DIR }}
        with:
          host: ${{ secrets.WIN_HOST }}
          port: ${{ secrets.WIN_PORT }}
          username: ${{ secrets.WIN_USER }}
          # 使用私钥登录（密钥登录模式）
          key: ${{ secrets.WIN_SSH_KEY }}
          # Windows 服务器默认 shell 为 PowerShell
          script: |
            $dir = "$env:FRONTEND_REMOTE_DIR"
            $tgz = Join-Path $dir "dist.tar.gz"
            if (-not (Test-Path $tgz)) {
              throw "未找到 $tgz，前端上传可能失败"
            }
            Write-Host "解压 $tgz 到 $dir ..."
            # bsdtar 解压，-x 解包 -z 解 gzip -f 指定文件；
            # --strip-components 1 去掉打包时最外层 dist/ 目录，使文件直接落到网站根目录；
            # 默认覆盖同名文件、不清空目录（与旧 overwrite:false 语义一致，保留用户静态资源）
            tar -xzf $tgz -C $dir --strip-components 1
            Remove-Item -Path $tgz -Force
            Write-Host "前端解压完成"
