# GitHub Actions workflow: Build and deploy MyAuth frontend/backend to a Windows Baota panel
#
# What this workflow does:
#   1. The "changes" job detects whether this push modified the backend (myauth/**)
#      or the frontend (myauth-web/**).
#   2. Frontend-only change -> build and upload the frontend dist only, do NOT restart the backend.
#      Backend-only change   -> build the jar, upload it, then restart the Java process.
#      Both changed          -> both deploy jobs run in parallel.
#   3. Backend deploy: Maven + JDK 21 builds the jar, gh CLI uploads it to a GitHub Release (CDN),
#      then a PowerShell script on the server pulls the jar via the CDN and restarts
#      (pull mode avoids slow cross-border push bandwidth; ships with backup/rollback).
#   4. Frontend deploy: Node + Yarn builds dist, packages it into a tar.gz, uploads it to a GitHub
#      Release, then the server downloads and extracts it over the website root.
#
# Manual trigger (workflow_dispatch):
#   The backend / frontend dropdowns force control:
#     auto   = decide automatically based on code changes (with no change baseline on manual runs,
#              this is effectively "no deploy")
#     deploy = force deploy this side
#     skip   = force skip this side (even if there are changes)
#
# ---------------------------------------------------------------------------
# IMPORTANT - why the deploy logic lives in separate .ps1 files (2026-08-15):
#   The Windows server OpenSSH default shell is cmd.exe, NOT PowerShell. The
#   appleboy/ssh-action plugin sends its "script" text verbatim to the server's
#   default shell, so inline PowerShell syntax (e.g. "$dir = ...") failed with
#   "'$dir' is not recognized as an internal or external command". The plugin
#   also injects environment variables as bash-style "export" lines, which are
#   invalid in cmd.exe, and cmd.exe limits a command line to 8191 characters.
#
#   Therefore this workflow:
#     a. builds the long PowerShell deploy logic into deploy-backend.ps1 /
#        deploy-frontend.ps1 on the Linux runner (pure ASCII English, no secrets);
#     b. uploads ONLY these tiny files (a few KB) plus the optional config via
#        native scp (OpenSSH SFTP subsystem is shell-independent and fast for
#        small files - the slow cross-border scp was only a problem for the big
#        66MB jar, which now travels via the GitHub Release CDN);
#     c. runs a single plain cmd.exe-compatible bootstrap line that just launches
#        powershell.exe -File <uploaded script>, so it works regardless of the
#        server default shell.
#   The large artifacts (myauth.jar, dist.tar.gz) are pulled by the server from
#   the GitHub Release, matching the "build on GitHub, pull from Release" goal.
# ---------------------------------------------------------------------------
#
# Prerequisites:
#   - Windows server has OpenSSH Server installed and enabled (Baota usually installs it).
#   - The server firewall allows the SSH port (default 22).
#   - All required secrets are configured under Settings -> Secrets and variables -> Actions.
#   - The backend jar target dir must exist on the server and be writable; the frontend
#     website root dir must exist and be writable.
#
# NOTE: All comments and script strings in this file are kept pure ASCII English on purpose,
# so that the generated .ps1 files survive transfer to a Chinese-locale Windows server
# without encoding corruption (garbled Chinese previously broke the scripts).

name: Deploy to Windows Baota Panel

on:
  # Only trigger on push to master when the touched paths match the frontend/backend dirs
  push:
    branches:
      - master
    paths:
      - 'myauth/**'
      - 'myauth-web/**'
  # Support manual trigger from the Actions page to force deploy either side
  workflow_dispatch:
    inputs:
      backend:
        description: 'Backend deploy strategy'
        type: choice
        options:
          - auto
          - deploy
          - skip
        default: auto
      frontend:
        description: 'Frontend deploy strategy'
        type: choice
        options:
          - auto
          - deploy
          - skip
        default: auto

# GITHUB_TOKEN permissions: gh release create/upload needs contents write.
# (Without this, the default GITHUB_TOKEN contents scope is read-only and gh release upload fails with 403)
permissions:
  contents: write

# All configurable sensitive/environment-dependent values are injected via secrets, no hardcoding
env:
  # Fixed name of the backend jar on the server, so the restart script can locate it.
  # Kept identical to the existing myauth.jar on the server to overwrite and restart in place.
  BACKEND_JAR_NAME: myauth.jar

jobs:
  # ============================================================
  # Job 0: change detection
  # Decide whether this push changed the backend or the frontend, and expose the result
  # to the two deploy jobs as conditions.
  # ============================================================
  changes:
    runs-on: ubuntu-latest
    outputs:
      backend: ${{ steps.filter.outputs.backend }}
      frontend: ${{ steps.filter.outputs.frontend }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Detect changed paths
        uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            backend:
              - 'myauth/**'
            frontend:
              - 'myauth-web/**'

  # ============================================================
  # Job 1: backend deploy (runs when the backend changed, or manual deploy is forced)
  # ============================================================
  deploy-backend:
    needs: changes
    # Trigger conditions:
    #   push event with a backend change detected, and not manually skipped;
    #   or manual trigger with backend = deploy
    if: |
      (github.event_name == 'push' && needs.changes.outputs.backend == 'true' && github.event.inputs.backend != 'skip') ||
      github.event.inputs.backend == 'deploy'
    # Ubuntu runner builds faster; the artifact is then deployed to the Windows server
    runs-on: ubuntu-latest

    steps:
      # Step 1: checkout the code
      - name: Checkout repository
        uses: actions/checkout@v4

      # Step 2: set up JDK 21 (must match java.version in pom.xml)
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          # Enable Maven dependency caching to speed up subsequent builds
          cache: maven

      # Step 3: build the backend with Maven, skipping tests to shorten CI time
      # Notes:
      #   1. The real config/application.yml is git-ignored and never committed or leaked;
      #   2. The repo only ships config/application.example.yml (a template with ${MYAUTH_*}
      #      placeholders), so the jar is packed with template defaults; the production config is
      #      provided by the external file C:/wwwroot/myauth/config/application.yml on the server
      #      (Spring Boot reads it first, and re-uploading the jar does not overwrite it);
      #   3. Defensively delete any real config so it is never accidentally packed into the jar.
      - name: Build backend with Maven
        working-directory: ./myauth
        run: |
          # Defensive check: make sure no real external config exists in the packaging env
          if [ -f src/main/resources/config/application.yml ]; then
            echo "WARN: found real config/application.yml, skipped packaging it"
            rm -f src/main/resources/config/application.yml
          fi
          mvn -B package -DskipTests

      # Step 4: rename the built jar to the fixed name (myauth.jar) for the gh release upload
      #      Note: this jar is about 66.80MB. We no longer gzip it (gzip caused "gzip header
      #      corruption / remote extraction failure", a pitfall hit on 2026-08-15). Upload the
      #      original jar to the Release and let the server pull it via the GitHub CDN.
      - name: Rename backend jar
        working-directory: ./myauth
        run: |
          ls target/*.jar
          cp target/myauth-*.jar target/${{ env.BACKEND_JAR_NAME }}
          ls -la target/${{ env.BACKEND_JAR_NAME }}

      # Step 5: upload the backend jar to a GitHub Release via gh CLI (fixed tag: always-latest)
      #
      # Background (2026-08-15, switched from scp to Release pull):
      #   - Old scheme: the runner pushed the jar via scp to a China-based server; cross-border
      #     upload bandwidth was very slow (a few KB/s).
      #   - New scheme: the runner uploads the jar to a GitHub Release (CDN) with gh CLI, and the
      #     server downloads it with curl. Pulling from the GitHub CDN is usually far faster than
      #     the runner-to-China upload path; "pull" is also more reliable than "push".
      #   - The repo is public, so the release is anonymously downloadable; no auth needed.
      #   - A fixed tag "always-latest" is used; each run overwrites the same-named asset
      #     (myauth.jar), and the server keeps a fixed URL.
      #
      # Key points:
      #   - GITHUB_TOKEN is injected automatically by Actions; gh is preinstalled on the runner.
      #   - gh release upload fails on an existing same-named asset, so use --clobber to overwrite.
      - name: Upload backend jar to GitHub Release
        env:
          # Token provided automatically by Actions (repo contents write permission)
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail

          ts() { date '+%H:%M:%S'; }
          mark() { echo "[$(ts)] $*"; }
          START_TIME=$(date +%s)

          src="myauth/target/${{ env.BACKEND_JAR_NAME }}"
          if [ ! -f "$src" ]; then
            mark "ERROR: source file not found: $src"
            exit 1
          fi
          src_size=$(stat -c%s "$src")
          src_size_hr=$(numfmt --to=iec --suffix=B "$src_size" 2>/dev/null || echo "${src_size}B")

          RELEASE_TAG="always-latest"
          mark "==== Uploading to GitHub Release ===="
          mark "Source    : $src ($src_size_hr)"
          mark "Release   : ${GITHUB_REPOSITORY} tag=${RELEASE_TAG}"
          mark "Asset     : ${{ env.BACKEND_JAR_NAME }}"

          # 1. Create or update the release (if it exists, just point the tag at the latest commit)
          mark "[$(ts)] Creating/updating release ${RELEASE_TAG} ..."
          gh release create "$RELEASE_TAG" \
            --title "Auto-deploy (latest)" \
            --notes "Fixed release produced by auto-deploy, used by the server to pull the latest build." \
            --latest || true   # returns non-zero if it already exists; ignore and continue

          # 2. Upload the asset (--clobber overwrites the same-named file)
          mark "[$(ts)] Uploading asset ..."
          gh release upload "$RELEASE_TAG" "$src" --clobber
          rc=$?
          if [ "$rc" -ne 0 ]; then
            mark "ERROR: gh release upload failed rc=$rc"
            exit $rc
          fi

          mark "[$(ts)] Upload finished, total $(( $(date +%s) - START_TIME ))s"
          exit 0

      # Step 6: generate deploy-backend.ps1 - the full PowerShell deploy logic for the server.
      #
      # Why a separate .ps1 file instead of an inline ssh-action script:
      #   - The server default shell is cmd.exe, so inline PowerShell syntax fails there.
      #   - A .ps1 executed via "powershell.exe -File" avoids both the wrong-shell problem
      #     and the cmd.exe 8191-character command line limit.
      #   - The script contains NO secrets (paths/repo/url are baked in as non-secret values),
      #     so it is safe to keep on the server.
      #
      # Robustness guarantees:
      #   1. Back up the old jar as myauth.jar.bak before starting the new jar;
      #   2. Use WMI to find and force-stop the java process whose command line contains myauth.jar;
      #   3. Poll port 6401 (up to ~90s) after starting to confirm the app is alive;
      #   4. If the new jar fails to start (port not open), automatically roll back to
      #      myauth.jar.bak and restart the old version;
      #   5. Final fallback: throw an error to mark the run as failed for human attention if the
      #      port is still closed, but by then the old version is already running.
      #   6. At the start, write ClientAliveInterval=30 and ClientAliveCountMax=10 into the
      #      Windows OpenSSH sshd_config and restart sshd, so the SSH channel is not killed as
      #      idle while the server downloads the jar from the GitHub CDN.
      - name: Generate backend deploy script (deploy-backend.ps1)
        run: |
          cat > deploy-backend.ps1 <<'PS1EOF'
          # deploy-backend.ps1 - MyAuth backend deploy script (runs on the Windows server)
          #
          # Generated by GitHub Actions (deploy-to-bt-win.yml) and uploaded to the server.
          # The workflow builds the jar, uploads it to a GitHub Release (CDN), then this
          # script pulls the jar from the Release and restarts the Java process.
          #
          # Flow:
          #   1. Apply idempotent sshd ClientAlive keepalive so the SSH channel survives the
          #      long jar download (server -> GitHub CDN) without being killed as idle.
          #   2. Move the uploaded config/application.yml into place (optional).
          #   3. Download myauth.jar from the Release into myauth.jar.new (pull mode).
          #   4. Back up the old jar, replace it, restart Java and poll port 6401.
          #   5. Roll back to the old jar if the new one fails to start.
          #
          # NOTE: keep this file pure ASCII English; the server locale is Chinese (GBK) and
          # non-ASCII bytes would be misread when the file is parsed without a BOM.

          $ErrorActionPreference = "Stop"

          # ---- baked-in parameters (injected by the workflow at generation time) ----
          $backendDir = "${{ secrets.BACKEND_REMOTE_DIR }}"
          $jarName    = "${{ env.BACKEND_JAR_NAME }}"
          $listenPort = 6401   # keep in sync with the Baota command line --server.port=6401
          $javaExe    = "C:\BtSoft\jdk\jdk21\bin\java.exe"
          # Fixed GitHub Release download URL (public repo, anonymous access)
          $releaseUrl = "https://github.com/${{ github.repository }}/releases/download/always-latest/$jarName"

          $jarPath    = Join-Path $backendDir $jarName
          $bakJarPath = Join-Path $backendDir ($jarName + ".bak")
          $newJarPath = Join-Path $backendDir ($jarName + ".new")
          $gzJarPath  = Join-Path $backendDir ($jarName + ".gz")

          Write-Host "Release download URL: $releaseUrl"
          Write-Host "Backend dir : $backendDir"
          Write-Host "Jar path    : $jarPath"
          Write-Host "Listen port : $listenPort"

          # ---- 0. Idempotent sshd keepalive (write-only, NO service restart) ----
          # Windows OpenSSH sshd_config default path: C:\ProgramData\ssh\sshd_config
          # Setting ClientAliveInterval=30 + ClientAliveCountMax=10 helps FUTURE SSH
          # connections survive idle periods while the server downloads the jar from the
          # GitHub CDN.
          # IMPORTANT: do NOT restart sshd here - on Windows OpenSSH, restarting the sshd
          # service kills ALL active sessions, including the very session running this
          # script, which would abort the deploy. The new keepalive takes effect on the
          # next SSH connection automatically.
          $sshdConfig = "C:\ProgramData\ssh\sshd_config"
          if (Test-Path $sshdConfig) {
              $lines = Get-Content $sshdConfig -ErrorAction SilentlyContinue
              $hasInterval = $lines | Where-Object { $_ -match '^\s*ClientAliveInterval\s+' }
              $hasCountMax = $lines | Where-Object { $_ -match '^\s*ClientAliveCountMax\s+' }
              if (-not $hasInterval) {
                  Add-Content -Path $sshdConfig -Value "ClientAliveInterval 30"
              }
              if (-not $hasCountMax) {
                  Add-Content -Path $sshdConfig -Value "ClientAliveCountMax 10"
              }
              if ($hasInterval -and $hasCountMax) {
                  Write-Host "sshd keepalive already configured, skipping"
              } else {
                  Write-Host "sshd keepalive config written (applies on next SSH connection; sshd NOT restarted to avoid killing this session)"
              }
          } else {
              Write-Host "WARN: sshd_config not found at $sshdConfig, skipping keepalive config"
          }

          # ---- 0. Move the freshly uploaded config into place ----
          # The workflow scp uploads application.yml to $backendDir; move it into config/.
          # If the secret BACKEND_CONFIG_YML was empty the workflow skipped the upload, so
          # the existing server config is kept untouched.
          $incomingConfig = Join-Path $backendDir "application.yml"
          $configDir  = Join-Path $backendDir "config"
          $prodConfig = Join-Path $configDir "application.yml"
          if (Test-Path $incomingConfig) {
              if (-not (Test-Path $configDir)) {
                  New-Item -ItemType Directory -Path $configDir -Force | Out-Null
              }
              Move-Item -Path $incomingConfig -Destination $prodConfig -Force
              Write-Host "config\application.yml updated from the uploaded file"
          } else {
              Write-Host "WARN: no uploaded application.yml, keeping the existing server config"
          }

          # ---- helpers ----
          # Wait for a TCP port to open: probe every 3s up to TimeoutSec
          function Wait-PortOpen {
              param([int]$Port, [int]$TimeoutSec = 90)
              $deadline = (Get-Date).AddSeconds($TimeoutSec)
              while ((Get-Date) -lt $deadline) {
                  try {
                      $tcp = New-Object System.Net.Sockets.TcpClient
                      $tcp.Connect("127.0.0.1", $Port)
                      $tcp.Close()
                      return $true
                  } catch {
                      Start-Sleep -Seconds 3
                  }
              }
              return $false
          }

          # Locate the java process whose command line contains the jar name and force-stop it
          function Stop-MyauthProcess {
              $procs = Get-CimInstance Win32_Process -Filter "Name = 'java.exe'" `
                  | Where-Object { $_.CommandLine -like "*$jarName*" }
              foreach ($p in $procs) {
                  Write-Host "Stopping old process PID=$($p.ProcessId)"
                  Stop-Process -Id $p.ProcessId -Force -ErrorAction SilentlyContinue
              }
              Start-Sleep -Seconds 3
          }

          # Start the jar with arguments identical to the Baota command line
          function Start-Myauth {
              param([string]$JarToRun)
              Write-Host "Starting jar: $JarToRun"
              Start-Process -FilePath $javaExe `
                  -ArgumentList "-jar", "-Xmx1024M", "-Xms256M", `
                      "`"$JarToRun`"", "--server.port=$listenPort" `
                  -WindowStyle Hidden `
                  -WorkingDirectory $backendDir
          }

          # ---- main flow ----

          # 1. Download the latest jar from the GitHub Release to myauth.jar.new
          #    Downloading to .new (not the official name) avoids a file-lock conflict with the
          #    running java process. If the download fails (network/Release not ready) we keep the
          #    old process untouched, so production is unaffected.
          if (Test-Path $newJarPath) {
              # Clear a leftover .new first to avoid stale-state misjudgment
              Remove-Item -Path $newJarPath -Force -ErrorAction SilentlyContinue
          }
          Write-Host "Downloading from GitHub Release $releaseUrl ..."
          # Invoke-WebRequest download; -UseBasicParsing avoids the IE engine overhead
          try {
              Invoke-WebRequest -Uri $releaseUrl -OutFile $newJarPath -UseBasicParsing -TimeoutSec 600
              $dlSize = (Get-Item $newJarPath).Length
              if ($dlSize -lt 10MB) {
                  Write-Host "WARN: download result is only ${dlSize}B, likely incomplete; deleting and skipping replacement"
                  Remove-Item -Path $newJarPath -Force -ErrorAction SilentlyContinue
              } else {
                  Write-Host "Download OK, myauth.jar.new size $dlSize bytes"
              }
          } catch {
              Write-Host "ERROR: failed to download from Release ($($_.Exception.Message))"
              # Do not throw; let the flow keep the existing jar (effectively keeping the old
              # version running), so an occasional download failure does not crash the deploy.
          }

          # 2. Clean stale intermediate files / quarantine broken jars
          #    A normal jar is about 66.80MB; anything below 10MB is treated as broken.
          if (Test-Path $gzJarPath) {
              Write-Host "Found stale $gzJarPath, removing it (this flow no longer uses .gz) ..."
              try {
                  Remove-Item -Path $gzJarPath -Force -ErrorAction Stop
                  Write-Host "Removed stale .jar.gz"
              } catch {
                  Write-Host "WARN: failed to remove stale .jar.gz ($($_.Exception.Message))"
              }
          }
          if (Test-Path $jarPath) {
              $existingJarSize = (Get-Item $jarPath).Length
              if ($existingJarSize -lt 10MB) {
                  Write-Host "WARN: existing $jarName is only ${existingJarSize}B, likely broken; renaming to .bak.broken for inspection"
                  $brokenPath = Join-Path $backendDir ($jarName + ".bak.broken")
                  try {
                      Move-Item -Path $jarPath -Destination $brokenPath -Force
                      Write-Host "Quarantined suspicious broken jar to $brokenPath"
                  } catch {
                      Write-Host "WARN: failed to quarantine broken jar ($($_.Exception.Message))"
                  }
              } else {
                  Write-Host "Existing $jarName size $existingJarSize bytes, OK"
              }
          }

          # 3. Back up the current (old) jar for rollback on failure
          #    Note: the backup MUST happen before the (new) jar overwrites $jarPath; otherwise
          #    the .bak would be the new jar and rollback would be meaningless.
          if (Test-Path $jarPath) {
              Copy-Item -Path $jarPath -Destination $bakJarPath -Force
              Write-Host "Backed up old jar -> $bakJarPath"
          } else {
              Write-Host "WARN: $jarPath does not exist, no old jar to back up (first deploy, or the previous jar was quarantined as broken)"
          }

          # 4. Stop the old process (release the java lock on myauth.jar)
          Stop-MyauthProcess

          # 5. Replace the official jar with .new
          #    .new was downloaded in step 1 from the GitHub Release. After the old process
          #    stops, the jar lock is released and .new is atomically moved (renamed) to the
          #    official myauth.jar. If .new is missing or too small, keep the old jar untouched.
          if (Test-Path $newJarPath) {
              $newSize = (Get-Item $newJarPath).Length
              if ($newSize -lt 10MB) {
                  Write-Host "WARN: $newJarPath is only ${newSize}B, likely a broken upload; not replacing this time, keeping the existing jar"
                  Remove-Item -Path $newJarPath -Force -ErrorAction SilentlyContinue
              } else {
                  Move-Item -Path $newJarPath -Destination $jarPath -Force
                  Write-Host "Replaced the official jar with .new, current size $newSize bytes"
              }
          } else {
              Write-Host "WARN: $newJarPath not found, skipping jar replacement"
          }

          # 6. Start the (possibly replaced) jar
          Start-Myauth -JarToRun $jarPath

          # 7. Wait for the new jar to be ready
          $ok = Wait-PortOpen -Port $listenPort -TimeoutSec 90
          if ($ok) {
              Write-Host "New version started OK, port $listenPort is ready"
              exit 0
          }

          # 8. New version failed to start -> roll back to the old jar and restart
          Write-Host "New version failed to start, rolling back to the old jar ..."
          Stop-MyauthProcess
          if (Test-Path $bakJarPath) {
              Copy-Item -Path $bakJarPath -Destination $jarPath -Force
              Start-Myauth -JarToRun $jarPath
              $ok = Wait-PortOpen -Port $listenPort -TimeoutSec 90
              if ($ok) {
                  Write-Host "Rolled back to the old version, port $listenPort is ready (service not interrupted)"
                  exit 0
              }
          }

          # 9. Final fallback: neither the new nor the rolled-back version started; throw to mark
          #    the run as failed for human attention
          throw "FATAL: neither the new nor the rolled-back version started, port $listenPort is not ready; check the server immediately!"
          PS1EOF
          ls -la deploy-backend.ps1

      # Step 7: generate the production config (config/application.yml) from the whole-file secret.
      # If the secret is empty, the file is not created and the existing server config is kept.
      - name: Generate production config (application.yml) from secret
        env:
          BACKEND_CONFIG_YML: ${{ secrets.BACKEND_CONFIG_YML }}
        run: |
          if [ -n "$BACKEND_CONFIG_YML" ]; then
            printf '%s\n' "$BACKEND_CONFIG_YML" > application.yml
            echo "Generated application.yml from BACKEND_CONFIG_YML"
          else
            echo "WARN: BACKEND_CONFIG_YML is empty; server config will be kept as-is (no config upload)"
          fi

      # Step 8: upload the tiny deploy files (ps1 + optional config, a few KB) via native scp.
      # Native scp uses the SFTP subsystem, which is shell-independent on Windows OpenSSH, so it
      # works even though the server default shell is cmd.exe. Only small files go this way; the
      # large jar travels via the GitHub Release CDN (see Step 5).
      - name: Upload backend deploy files to server (scp, small files only)
        env:
          WIN_HOST: ${{ secrets.WIN_HOST }}
          WIN_PORT: ${{ secrets.WIN_PORT }}
          WIN_USER: ${{ secrets.WIN_USER }}
          WIN_SSH_KEY: ${{ secrets.WIN_SSH_KEY }}
          BACKEND_REMOTE_DIR: ${{ secrets.BACKEND_REMOTE_DIR }}
        run: |
          set -euo pipefail
          # Prepare the private key for the OpenSSH client
          install -d -m 700 "$HOME/.ssh"
          printf '%s\n' "$WIN_SSH_KEY" > "$HOME/.ssh/deploy_key"
          chmod 600 "$HOME/.ssh/deploy_key"
          # Normalize the Windows target dir to forward slashes for scp
          target="${BACKEND_REMOTE_DIR//\\//}/"
          # Build the file list (config only exists when BACKEND_CONFIG_YML is set)
          files="deploy-backend.ps1"
          if [ -f application.yml ]; then
            files="$files application.yml"
          fi
          scp -P "$WIN_PORT" -i "$HOME/.ssh/deploy_key" \
              -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null \
              $files "$WIN_USER@$WIN_HOST:${target}"
          echo "scp upload done -> ${target}"

      # Step 9: run the backend deploy script on the server.
      # The server OpenSSH default shell is cmd.exe, so this bootstrap is a single plain
      # cmd.exe-compatible line that only launches the already-uploaded PowerShell script.
      # It also works if the default shell were PowerShell, so it is robust either way.
      - name: Run backend deploy script on server
        uses: appleboy/ssh-action@v1.2.5
        with:
          host: ${{ secrets.WIN_HOST }}
          port: ${{ secrets.WIN_PORT }}
          username: ${{ secrets.WIN_USER }}
          # Private-key login (key auth mode)
          key: ${{ secrets.WIN_SSH_KEY }}
          script: |
            powershell.exe -NoProfile -ExecutionPolicy Bypass -File "${{ secrets.BACKEND_REMOTE_DIR }}\deploy-backend.ps1"

  # ============================================================
  # Job 2: frontend deploy (runs when the frontend changed, or manual deploy is forced)
  # A frontend-only update never touches the backend process; the website has zero downtime
  # ============================================================
  deploy-frontend:
    needs: changes
    # Trigger conditions:
    #   push event with a frontend change detected, and not manually skipped;
    #   or manual trigger with frontend = deploy
    if: |
      (github.event_name == 'push' && needs.changes.outputs.frontend == 'true' && github.event.inputs.frontend != 'skip') ||
      github.event.inputs.frontend == 'deploy'
    runs-on: ubuntu-latest

    steps:
      # Step 1: checkout the code
      - name: Checkout repository
        uses: actions/checkout@v4

      # Step 2: set up Node.js for building the frontend
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          # Use yarn as the package manager and lock yarn.lock for reproducible dependencies
          cache: yarn
          cache-dependency-path: myauth-web/yarn.lock

      # Step 3: install frontend dependencies and build the production bundle
      # Notes:
      #   1. Build-time variables (project name/version, etc.) come from the committed
      #      myauth-web/.env;
      #   2. The real serverConfig.json is git-ignored and removed from the repo (not committed,
      #      not leaked);
      #   3. The whole-file Secret (FRONTEND_CONFIG_JSON) is mapped via env and written out as the
      #      production serverConfig.json before build, avoiding inline ${{ }} parsing errors and
      #      secret leakage in the shell;
      #   4. If the Secret is not configured, the repo template default is kept (local/test only).
      - name: Build frontend with Yarn
        working-directory: ./myauth-web
        env:
          # Map the whole-file secret to an env var for safe reference in the shell below
          FRONTEND_CONFIG_JSON: ${{ secrets.FRONTEND_CONFIG_JSON }}
        run: |
          yarn install --frozen-lockfile
          # Overwrite serverConfig.json with the whole-file secret (only if it is set)
          if [ -n "$FRONTEND_CONFIG_JSON" ]; then
            printf '%s\n' "$FRONTEND_CONFIG_JSON" > public/serverConfig.json
            echo "Generated production serverConfig.json from FRONTEND_CONFIG_JSON"
          else
            echo "WARN: FRONTEND_CONFIG_JSON not set, using the repo default serverConfig.json"
          fi
          yarn build

      # Step 4: package the frontend dist and upload it to a GitHub Release via gh CLI
      # (same release as the backend)
      #
      # Background (2026-08-15, switched from scp to Release pull, unified with the backend):
      #   1. Package the whole dist into a single tar.gz (frontend js/css compress extremely well,
      #      often to 1/10 or less);
      #   2. Upload it to the fixed release (tag=always-latest, asset name dist.tar.gz,
      #      --clobber overwrite);
      #   3. The server then downloads dist.tar.gz from the Release and extracts it into the
      #      website root with Windows bsdtar (overwrites same-named files, does NOT clear the
      #      directory, keeping static resources placed by the user).
      - name: Package and upload frontend dist to GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail

          ts() { date '+%H:%M:%S'; }
          mark() { echo "[$(ts)] $*"; }
          START_TIME=$(date +%s)

          # 1. Package dist into a single tar.gz
          mark "==== Packaging frontend dist ===="
          tar -C myauth-web -czf dist.tar.gz dist
          src_size=$(stat -c%s dist.tar.gz)
          src_size_hr=$(numfmt --to=iec --suffix=B "$src_size" 2>/dev/null || echo "${src_size}B")
          mark "Generated dist.tar.gz ($src_size_hr)"

          # 2. Upload to the fixed release (create it if it does not exist)
          RELEASE_TAG="always-latest"
          mark "==== Uploading to GitHub Release ===="
          mark "Release   : ${GITHUB_REPOSITORY} tag=${RELEASE_TAG}"
          mark "Asset     : dist.tar.gz"

          gh release create "$RELEASE_TAG" \
            --title "Auto-deploy (latest)" \
            --notes "Fixed release produced by auto-deploy, used by the server to pull the latest build." \
            --latest || true

          mark "[$(ts)] Uploading asset ..."
          gh release upload "$RELEASE_TAG" dist.tar.gz --clobber
          rc=$?
          if [ "$rc" -ne 0 ]; then
            mark "ERROR: gh release upload failed rc=$rc"
            exit $rc
          fi
          rm -f dist.tar.gz
          mark "[$(ts)] Upload finished, total $(( $(date +%s) - START_TIME ))s"

      # Step 5: generate deploy-frontend.ps1 - downloads dist.tar.gz from the Release and
      # extracts it over the website root. Same reasoning as the backend .ps1: the server
      # default shell is cmd.exe, so the PowerShell logic must run via powershell.exe -File.
      # Pull mode (server -> GitHub CDN) avoids the slow cross-border scp upload.
      - name: Generate frontend deploy script (deploy-frontend.ps1)
        run: |
          cat > deploy-frontend.ps1 <<'PS1EOF'
          # deploy-frontend.ps1 - MyAuth frontend deploy script (runs on the Windows server)
          #
          # Generated by GitHub Actions (deploy-to-bt-win.yml) and uploaded to the server.
          # Downloads dist.tar.gz from the GitHub Release and extracts it over the website
          # root with the built-in Windows bsdtar. Overwrites same-named files and does NOT
          # clear the directory, keeping static resources placed by the user.
          #
          # NOTE: keep this file pure ASCII English (see deploy-backend.ps1).

          $ErrorActionPreference = "Stop"

          # ---- baked-in parameters (injected by the workflow at generation time) ----
          $webDir = "${{ secrets.FRONTEND_REMOTE_DIR }}"
          $tgz = Join-Path $webDir "dist.tar.gz"
          # Fixed GitHub Release download URL (public repo, anonymous access)
          $releaseUrl = "https://github.com/${{ github.repository }}/releases/download/always-latest/dist.tar.gz"
          Write-Host "Downloading from Release: $releaseUrl"
          try {
              Invoke-WebRequest -Uri $releaseUrl -OutFile $tgz -UseBasicParsing -TimeoutSec 600
          } catch {
              throw "Failed to download dist.tar.gz: $($_.Exception.Message)"
          }
          if (-not (Test-Path $tgz)) {
              throw "dist.tar.gz not found at $tgz, frontend download failed"
          }
          $tgzSize = (Get-Item $tgz).Length
          if ($tgzSize -lt 1MB) {
              throw "dist.tar.gz is too small (${tgzSize}B), download incomplete"
          }
          Write-Host "Download OK, size $tgzSize bytes; extracting to $webDir ..."
          # bsdtar extraction: -x extract, -z gzip, -f file;
          # --strip-components 1 removes the outer dist/ directory from the archive so files land
          # directly in the website root; overwrites same-named files and does NOT clear the dir
          tar -xzf $tgz -C $webDir --strip-components 1
          Remove-Item -Path $tgz -Force
          Write-Host "Frontend extraction finished"
          PS1EOF
          ls -la deploy-frontend.ps1

      # Step 6: upload the tiny deploy script (a few KB) via native scp.
      # The script is placed in the backend deploy dir (shared deploy area), not in the public
      # web root. Same reasoning as the backend scp step.
      - name: Upload frontend deploy script to server (scp, small file)
        env:
          WIN_HOST: ${{ secrets.WIN_HOST }}
          WIN_PORT: ${{ secrets.WIN_PORT }}
          WIN_USER: ${{ secrets.WIN_USER }}
          WIN_SSH_KEY: ${{ secrets.WIN_SSH_KEY }}
          BACKEND_REMOTE_DIR: ${{ secrets.BACKEND_REMOTE_DIR }}
        run: |
          set -euo pipefail
          # Prepare the private key for the OpenSSH client
          install -d -m 700 "$HOME/.ssh"
          printf '%s\n' "$WIN_SSH_KEY" > "$HOME/.ssh/deploy_key"
          chmod 600 "$HOME/.ssh/deploy_key"
          # Normalize the Windows target dir to forward slashes for scp
          target="${BACKEND_REMOTE_DIR//\\//}/"
          scp -P "$WIN_PORT" -i "$HOME/.ssh/deploy_key" \
              -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null \
              deploy-frontend.ps1 "$WIN_USER@$WIN_HOST:${target}"
          echo "scp upload done -> ${target}"

      # Step 7: run the frontend deploy script on the server (cmd.exe-compatible bootstrap,
      # same reasoning as the backend bootstrap).
      - name: Run frontend deploy script on server
        uses: appleboy/ssh-action@v1.2.5
        with:
          host: ${{ secrets.WIN_HOST }}
          port: ${{ secrets.WIN_PORT }}
          username: ${{ secrets.WIN_USER }}
          # Private-key login (key auth mode)
          key: ${{ secrets.WIN_SSH_KEY }}
          script: |
            powershell.exe -NoProfile -ExecutionPolicy Bypass -File "${{ secrets.BACKEND_REMOTE_DIR }}\deploy-frontend.ps1"
